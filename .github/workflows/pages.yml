# Semantropy web Playground → GitHub Pages.
#
# Copy this file to `.github/workflows/pages.yml` in the public repository
# (cat-left-paw/semantropy). It builds `dist-web/` from source on GitHub's
# runner and deploys only that build output; nothing is committed to a branch.
# See web/deploy/README.md for the one-time repository settings.
name: Deploy web Playground

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "resources/**"
      - "scripts/**"
      - "styles.css"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.web.config.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache the pinned dictionary
        uses: actions/cache@v4
        with:
          path: .cache/lindera
          key: lindera-${{ hashFiles('scripts/lindera/dictionaryHashes.mjs', 'scripts/lindera/linderaSource.mjs') }}
      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run lint:web
      - run: npm run test:web
      # Verifies the dictionary against the pinned SHA-256 before bundling.
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
